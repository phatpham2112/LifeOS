spring:
  config:
    import:
      - optional:file:./infra/.env[.properties]
      - optional:file:../infra/.env[.properties]
  application:
    name: lifeos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifeos}
    username: ${DB_USERNAME:lifeos}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
