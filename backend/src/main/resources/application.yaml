spring:
  application:
    name: lifeos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifeos}
    username: ${DB_USERNAME:lifeos}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
